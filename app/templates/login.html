<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gordify - Login</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    input { display: block; width: 100%; box-sizing: border-box; padding: .5rem; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <h1>Log in</h1>
  <p>Use your Navidrome username and password to login.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input name="username" placeholder="Username" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
