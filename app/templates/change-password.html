<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gordify - Change Password</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.2rem; }
    input { display: block; width: 100%; box-sizing: border-box; padding: .5rem; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <header>
    <a class="nav-link" href="/dashboard">Back to dashboard</a>
  </header>

  <h1>Change Password for: {{ username }}</h1>
  <p>Change your Navidrome user password. Password must be at least 8 letters and have at least one number and special character.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/change-password">
    <input name="oldpass" type="password" placeholder="Your current password" autocomplete="current-password" required>
    <input name="newpass" type="password" placeholder="New password..." autocomplete="new-password" required>
    <input name="newpass2" type="password" placeholder="Your new password again" autocomplete="new-password-again" required>
    <button type="submit">Change Password</button>
  </form>
</body>
</html>
